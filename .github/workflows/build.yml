name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pandas openpyxl xlrd pyzipper pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --collect-all customtkinter --name "ReportMerger" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ReportMerger-Windows
        path: dist/ReportMerger.exe
