name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pandas openpyxl xlrd pyzipper pyinstaller pillow windnd

    - name: Generate Splash Image
      run: |
        curl -s -L -o NanumGothicBold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/nanumgothic/NanumGothic-Bold.ttf"
        python -c "
        from PIL import Image, ImageDraw, ImageFont
        w, h = 400, 170
        # PyInstaller 투명 크로마키(Magenta) 적용으로 모서리 라운딩 구현
        img = Image.new('RGB', (w, h), (255, 0, 255))
        draw = ImageDraw.Draw(img)
        draw.rounded_rectangle([2, 2, w-3, h-3], radius=16, fill=(255, 255, 255), outline=(229, 232, 235), width=2)
        try:
            f_title = ImageFont.truetype('NanumGothicBold.ttf', 17)
            f_status = ImageFont.truetype('NanumGothicBold.ttf', 14)
            f_sub = ImageFont.truetype('NanumGothicBold.ttf', 11)
        except:
            f_title = f_status = f_sub = None
        draw.text((200, 42), '엑셀 문서 자동 취합 프로그램', font=f_title, fill=(25, 31, 40), anchor='mm')
        draw.text((200, 84), '프로그램을 실행 중입니다...', font=f_status, fill=(49, 130, 246), anchor='mm')
        draw.text((200, 122), '잠시만 기다려 주세요.', font=f_sub, fill=(139, 149, 161), anchor='mm')
        img.save('splash.png')
        "

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --splash splash.png --collect-all customtkinter --name "ReportMerger" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ReportMerger-Windows
        path: dist/ReportMerger.exe
